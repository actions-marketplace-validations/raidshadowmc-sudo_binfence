name: 'binfence'
description: 'Binary release security gate & mitigation regression auditor for CI/CD'
author: 'raidshadowmc-sudo'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  binary:
    description: 'Path to the compiled binary asset to audit (e.g. target/release/app or ./dist/app.exe)'
    required: true
  baseline:
    description: 'Optional path to local baseline binary to compare against for differential regressions'
    required: false
  fail-on-degraded:
    description: 'Fail the release gate if any security mitigation degraded from baseline'
    required: false
    default: 'true'
  fail-on-rwx:
    description: 'Fail the release gate if binary contains simultaneously writable and executable (W^X violating) sections'
    required: false
    default: 'true'
  fail-on-tampered:
    description: 'Fail the release gate if Authenticode digest does not match embedded signature'
    required: false
    default: 'true'
  require-aslr:
    description: 'Require ASLR / PIE to be enabled on the target binary'
    required: false
    default: 'true'
  require-dep:
    description: 'Require DEP / NX to be enabled on the target binary'
    required: false
    default: 'true'
  require-authenticode:
    description: 'Require binary to have an embedded Authenticode signature (useful for Windows release artifacts)'
    required: false
    default: 'false'
  require-cfg:
    description: 'Require Control Flow Guard (CFG) on Windows PE binaries'
    required: false
    default: 'false'
  require-stack-canary:
    description: 'Require Stack Canary / /GS buffer security check'
    required: false
    default: 'false'
  max-new-sections:
    description: 'Maximum allowable newly added binary sections compared to baseline'
    required: false
  max-entropy:
    description: 'Maximum allowable Shannon entropy (0.0 to 8.0) before flagging an anomaly'
    required: false
    default: '7.5'
  yara-rules:
    description: 'Optional path to YARA rules file or directory to scan against'
    required: false
  sarif-file:
    description: 'Output path for generated SARIF v2.1.0 security report'
    required: false
    default: 'binfence.sarif'
  summary:
    description: 'Automatically output rich Markdown report to GITHUB_STEP_SUMMARY'
    required: false
    default: 'true'
  version:
    description: 'Release version of binfence to download (e.g. v0.1.3). Defaults to action ref or v0.1.3.'
    required: false
    default: ''

outputs:
  passed:
    description: 'Whether the release gate passed all checks (true/false)'
    value: ${{ steps.run-binfence.outputs.passed }}
  sarif-path:
    description: 'Path to the generated SARIF report file'
    value: ${{ steps.run-binfence.outputs.sarif-path }}

runs:
  using: 'composite'
  steps:
    - name: Ensure binfence CLI is available
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        if command -v binfence &> /dev/null; then
          echo "binfence is already available in PATH: $(command -v binfence)"
          exit 0
        fi

        # Priority: explicit input > github.action_ref (if version tag v*) > fallback
        if [ -n "$INPUT_VERSION" ]; then
          VERSION="$INPUT_VERSION"
        elif [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+ ]]; then
          VERSION="$ACTION_REF"
        else
          VERSION="v0.1.3"
        fi
        echo "Selected binfence release version: $VERSION"

        OS="${RUNNER_OS}"
        ARCH="${RUNNER_ARCH}"

        case "$OS" in
          Linux)
            case "$ARCH" in
              X64) TARGET="x86_64-unknown-linux-gnu" ;;
              ARM64) TARGET="aarch64-unknown-linux-gnu" ;;
              *) echo "Unsupported Linux architecture: $ARCH" >&2; exit 1 ;;
            esac
            EXT="tar.gz"
            ;;
          macOS)
            case "$ARCH" in
              X64) TARGET="x86_64-apple-darwin" ;;
              ARM64) TARGET="aarch64-apple-darwin" ;;
              *) echo "Unsupported macOS architecture: $ARCH" >&2; exit 1 ;;
            esac
            EXT="tar.gz"
            ;;
          Windows)
            case "$ARCH" in
              X64) TARGET="x86_64-pc-windows-msvc" ;;
              *) echo "Unsupported Windows architecture: $ARCH" >&2; exit 1 ;;
            esac
            EXT="zip"
            ;;
          *)
            echo "Unsupported OS: $OS" >&2
            exit 1
            ;;
        esac

        ASSET_NAME="binfence-${TARGET}.${EXT}"
        DOWNLOAD_URL="https://github.com/raidshadowmc-sudo/binfence/releases/download/${VERSION}/${ASSET_NAME}"
        SUMS_URL="https://github.com/raidshadowmc-sudo/binfence/releases/download/${VERSION}/SHA256SUMS.txt"

        INSTALL_DIR="${RUNNER_TEMP:-/tmp}/binfence-bin"
        mkdir -p "$INSTALL_DIR"

        echo "Fetching binfence ${VERSION} for ${TARGET} from ${DOWNLOAD_URL}..."
        HTTP_CODE=$(curl -sSL -w "%{http_code}" -o "${INSTALL_DIR}/${ASSET_NAME}" "$DOWNLOAD_URL" || true)

        if [ "$HTTP_CODE" = "200" ]; then
          echo "Downloaded ${ASSET_NAME} successfully. Verifying SHA-256 integrity..."
          SUMS_FILE="${INSTALL_DIR}/SHA256SUMS.txt"
          if ! curl -fsSL -o "$SUMS_FILE" "$SUMS_URL"; then
            echo "CRITICAL SECURITY ERROR: Could not fetch SHA256SUMS.txt from ${SUMS_URL}!" >&2
            exit 1
          fi

          # Strip any Windows CRLF carriage returns so grep matches accurately
          tr -d '\r' < "$SUMS_FILE" > "${SUMS_FILE}.unix" && mv "${SUMS_FILE}.unix" "$SUMS_FILE"

          EXPECTED_HASH=$(grep -E "[[:space:]]${ASSET_NAME}$" "$SUMS_FILE" | awk '{print $1}' | tr -dc '0-9a-zA-Z' | tr '[:upper:]' '[:lower:]')
          if [ -z "$EXPECTED_HASH" ]; then
            echo "CRITICAL SECURITY ERROR: ${ASSET_NAME} not listed in SHA256SUMS.txt!" >&2
            exit 1
          fi

          if command -v sha256sum &> /dev/null; then
            ACTUAL_HASH=$( (cd "$INSTALL_DIR" && sha256sum "$ASSET_NAME") | awk '{print $1}' | tr -dc '0-9a-zA-Z' | tr '[:upper:]' '[:lower:]')
          elif command -v shasum &> /dev/null; then
            ACTUAL_HASH=$( (cd "$INSTALL_DIR" && shasum -a 256 "$ASSET_NAME") | awk '{print $1}' | tr -dc '0-9a-zA-Z' | tr '[:upper:]' '[:lower:]')
          else
            echo "CRITICAL SECURITY ERROR: Neither sha256sum nor shasum found on runner to verify hash!" >&2
            exit 1
          fi

          if [ "$EXPECTED_HASH" != "$ACTUAL_HASH" ]; then
            echo "CRITICAL SECURITY ERROR: SHA-256 checksum mismatch for ${ASSET_NAME}!" >&2
            echo "Expected: $EXPECTED_HASH" >&2
            echo "Actual:   $ACTUAL_HASH" >&2
            exit 1
          fi
          echo "SHA-256 checksum verified: $ACTUAL_HASH"

          echo "Extracting ${ASSET_NAME}..."
          if [ "$EXT" = "zip" ]; then
            unzip -q -o "${INSTALL_DIR}/${ASSET_NAME}" -d "$INSTALL_DIR"
          else
            tar -xzf "${INSTALL_DIR}/${ASSET_NAME}" -C "$INSTALL_DIR"
          fi

          if [ "$OS" != "Windows" ]; then
            chmod +x "${INSTALL_DIR}/binfence"
          fi
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
          echo "binfence installed to GITHUB_PATH."
        else
          echo "Failed to download prebuilt binary (HTTP ${HTTP_CODE}). Falling back to cargo install..." >&2
          if command -v cargo &> /dev/null; then
            cargo install --git https://github.com/raidshadowmc-sudo/binfence.git --locked --tag "$VERSION"
          else
            echo "Error: Prebuilt binary download failed and cargo is not installed on runner." >&2
            exit 1
          fi
        fi

    - name: Run binfence evaluation
      id: run-binfence
      shell: bash
      env:
        INPUT_BINARY: ${{ inputs.binary }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        BINFENCE_FAIL_ON_DEGRADED: ${{ inputs.fail-on-degraded }}
        BINFENCE_REQUIRE_ASLR: ${{ inputs.require-aslr }}
        BINFENCE_REQUIRE_DEP: ${{ inputs.require-dep }}
        BINFENCE_DISALLOW_RWX: ${{ inputs.fail-on-rwx }}
        BINFENCE_FAIL_ON_TAMPERED: ${{ inputs.fail-on-tampered }}
        BINFENCE_REQUIRE_AUTHENTICODE: ${{ inputs.require-authenticode }}
        BINFENCE_REQUIRE_CFG: ${{ inputs.require-cfg }}
        BINFENCE_REQUIRE_STACK_CANARY: ${{ inputs.require-stack-canary }}
        BINFENCE_MAX_NEW_SECTIONS: ${{ inputs.max-new-sections }}
        BINFENCE_MAX_ENTROPY: ${{ inputs.max-entropy }}
        BINFENCE_YARA_RULES: ${{ inputs.yara-rules }}
        BINFENCE_SARIF_FILE: ${{ inputs.sarif-file }}
        BINFENCE_SUMMARY: ${{ inputs.summary }}

      run: |
        ARGS=(--binary "$INPUT_BINARY")
        if [ -n "$INPUT_BASELINE" ]; then
          ARGS+=(--baseline "$INPUT_BASELINE")
        fi

        [ -z "$BINFENCE_MAX_NEW_SECTIONS" ] && unset BINFENCE_MAX_NEW_SECTIONS
        [ -z "$BINFENCE_YARA_RULES" ] && unset BINFENCE_YARA_RULES
        [ -z "$BINFENCE_MAX_ENTROPY" ] && unset BINFENCE_MAX_ENTROPY

        binfence "${ARGS[@]}"
        EXIT_CODE=$?

        if [ $EXIT_CODE -eq 0 ]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE
        fi
        echo "sarif-path=$BINFENCE_SARIF_FILE" >> "$GITHUB_OUTPUT"
