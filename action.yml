name: 'relgate'
description: 'Binary release security gate & mitigation regression auditor for CI/CD'
author: 'raidshadowmc-sudo'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  binary:
    description: 'Path to the compiled binary asset to audit (e.g. target/release/app or ./dist/app.exe)'
    required: true
  baseline:
    description: 'Optional path to local baseline binary to compare against for differential regressions'
    required: false
  fail-on-degraded:
    description: 'Fail the release gate if any security mitigation degraded from baseline'
    required: false
    default: 'true'
  fail-on-rwx:
    description: 'Fail the release gate if binary contains simultaneously writable and executable (W^X violating) sections'
    required: false
    default: 'true'
  fail-on-tampered:
    description: 'Fail the release gate if Authenticode digest does not match embedded signature'
    required: false
    default: 'true'
  require-aslr:
    description: 'Require ASLR / PIE to be enabled on the target binary'
    required: false
    default: 'true'
  require-dep:
    description: 'Require DEP / NX to be enabled on the target binary'
    required: false
    default: 'true'
  require-authenticode:
    description: 'Require binary to have an embedded Authenticode signature (useful for Windows release artifacts)'
    required: false
    default: 'false'
  require-cfg:
    description: 'Require Control Flow Guard (CFG) on Windows PE binaries'
    required: false
    default: 'false'
  require-stack-canary:
    description: 'Require Stack Canary / /GS buffer security check'
    required: false
    default: 'false'
  max-new-sections:
    description: 'Maximum allowable newly added binary sections compared to baseline'
    required: false
  max-entropy:
    description: 'Maximum allowable Shannon entropy (0.0 to 8.0) before flagging an anomaly'
    required: false
    default: '7.5'
  yara-rules:
    description: 'Optional path to YARA rules file or directory to scan against'
    required: false
  sarif-file:
    description: 'Output path for generated SARIF v2.1.0 security report'
    required: false
    default: 'relgate.sarif'
  summary:
    description: 'Automatically output rich Markdown report to GITHUB_STEP_SUMMARY'
    required: false
    default: 'true'
  version:
    description: 'Release version of relgate to download (e.g. v0.1.0)'
    required: false
    default: 'v0.1.0'

outputs:
  passed:
    description: 'Whether the release gate passed all checks (true/false)'
    value: ${{ steps.run-relgate.outputs.passed }}
  sarif-path:
    description: 'Path to the generated SARIF report file'
    value: ${{ steps.run-relgate.outputs.sarif-path }}

runs:
  using: 'composite'
  steps:
    - name: Ensure relgate CLI is available
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if command -v relgate &> /dev/null; then
          echo "relgate is already available in PATH: $(command -v relgate)"
          exit 0
        fi

        VERSION="${INPUT_VERSION:-v0.1.0}"
        OS="${RUNNER_OS}"
        ARCH="${RUNNER_ARCH}"

        case "$OS" in
          Linux)
            case "$ARCH" in
              X64) TARGET="x86_64-unknown-linux-gnu" ;;
              ARM64) TARGET="aarch64-unknown-linux-gnu" ;;
              *) echo "Unsupported Linux architecture: $ARCH" >&2; exit 1 ;;
            esac
            EXT="tar.gz"
            ;;
          macOS)
            case "$ARCH" in
              X64) TARGET="x86_64-apple-darwin" ;;
              ARM64) TARGET="aarch64-apple-darwin" ;;
              *) echo "Unsupported macOS architecture: $ARCH" >&2; exit 1 ;;
            esac
            EXT="tar.gz"
            ;;
          Windows)
            case "$ARCH" in
              X64) TARGET="x86_64-pc-windows-msvc" ;;
              *) echo "Unsupported Windows architecture: $ARCH" >&2; exit 1 ;;
            esac
            EXT="zip"
            ;;
          *)
            echo "Unsupported OS: $OS" >&2
            exit 1
            ;;
        esac

        ASSET_NAME="relgate-${TARGET}.${EXT}"
        DOWNLOAD_URL="https://github.com/raidshadowmc-sudo/relgate/releases/download/${VERSION}/${ASSET_NAME}"

        INSTALL_DIR="${RUNNER_TEMP:-/tmp}/relgate-bin"
        mkdir -p "$INSTALL_DIR"

        echo "Fetching relgate ${VERSION} for ${TARGET} from ${DOWNLOAD_URL}..."
        HTTP_CODE=$(curl -sSL -w "%{http_code}" -o "${INSTALL_DIR}/${ASSET_NAME}" "$DOWNLOAD_URL" || true)

        if [ "$HTTP_CODE" = "200" ]; then
          echo "Downloaded ${ASSET_NAME} successfully."
          if [ "$EXT" = "zip" ]; then
            unzip -q -o "${INSTALL_DIR}/${ASSET_NAME}" -d "$INSTALL_DIR"
          else
            tar -xzf "${INSTALL_DIR}/${ASSET_NAME}" -C "$INSTALL_DIR"
          fi
          chmod +x "${INSTALL_DIR}/relgate"* || true
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
          echo "relgate installed to GITHUB_PATH."
        else
          echo "Failed to download prebuilt binary (HTTP ${HTTP_CODE}). Falling back to cargo install..." >&2
          if command -v cargo &> /dev/null; then
            cargo install --git https://github.com/raidshadowmc-sudo/relgate.git --locked --tag "$VERSION" || cargo install --git https://github.com/raidshadowmc-sudo/relgate.git --locked
          else
            echo "Error: Prebuilt binary download failed and cargo is not installed on runner." >&2
            exit 1
          fi
        fi

    - name: Run relgate evaluation
      id: run-relgate
      shell: bash
      env:
        INPUT_BINARY: ${{ inputs.binary }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        RELGATE_FAIL_ON_DEGRADED: ${{ inputs.fail-on-degraded }}
        RELGATE_REQUIRE_ASLR: ${{ inputs.require-aslr }}
        RELGATE_REQUIRE_DEP: ${{ inputs.require-dep }}
        RELGATE_DISALLOW_RWX: ${{ inputs.fail-on-rwx }}
        RELGATE_FAIL_ON_TAMPERED: ${{ inputs.fail-on-tampered }}
        RELGATE_REQUIRE_AUTHENTICODE: ${{ inputs.require-authenticode }}
        RELGATE_REQUIRE_CFG: ${{ inputs.require-cfg }}
        RELGATE_REQUIRE_STACK_CANARY: ${{ inputs.require-stack-canary }}
        RELGATE_MAX_NEW_SECTIONS: ${{ inputs.max-new-sections }}
        RELGATE_MAX_ENTROPY: ${{ inputs.max-entropy }}
        RELGATE_YARA_RULES: ${{ inputs.yara-rules }}
        RELGATE_SARIF_FILE: ${{ inputs.sarif-file }}

      run: |
        ARGS=(--binary "$INPUT_BINARY")
        if [ -n "$INPUT_BASELINE" ]; then
          ARGS+=(--baseline "$INPUT_BASELINE")
        fi

        relgate "${ARGS[@]}"
        EXIT_CODE=$?

        if [ $EXIT_CODE -eq 0 ]; then
          echo "passed=true" >> "$GITHUB_OUTPUT"
        else
          echo "passed=false" >> "$GITHUB_OUTPUT"
          exit $EXIT_CODE
        fi
        echo "sarif-path=$RELGATE_SARIF_FILE" >> "$GITHUB_OUTPUT"
