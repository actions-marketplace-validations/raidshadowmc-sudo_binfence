name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Test & Clippy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check code formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run test suite
        run: cargo test --verbose

      - name: Build release binary
        run: cargo build --release --locked

      - name: Self-audit Release Gate (relgate on relgate)
        shell: bash
        run: |
          TARGET_BIN="${{ matrix.os == 'windows-latest' && 'target/release/relgate.exe' || 'target/release/relgate' }}"
          cargo run --release --locked -- --binary "$TARGET_BIN" --fail-on-rwx --require-aslr --require-dep
